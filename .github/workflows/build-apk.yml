name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners already ship the Android SDK at $ANDROID_HOME;
      # just make sure the platform / build-tools we need are present.
      - name: Install SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RSSICam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Also publish to a rolling "latest" release so the APK can be downloaded
      # directly from github.com (Actions artifacts live on Azure blob storage).
      - name: Publish APK to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RSSICam-debug.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "RSSICam latest debug build" --notes "Auto-built from main" --prerelease
          gh release upload latest RSSICam-debug.apk --clobber
          gh release edit latest --notes "Auto-built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%MZ)"
